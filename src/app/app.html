<button class="explore-fab" [class.visible]="showFab()" (click)="scrollToNav()" aria-label="Scroll to explore sections">
  <svg class="explore-fab-arrow" viewBox="0 0 16 22" fill="none" xmlns="http://www.w3.org/2000/svg">
    <polyline points="3,10 8,4 13,10" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="8" y1="4" x2="8" y2="18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
  </svg>
</button>

<app-hero (scrollToApp)="scrollToApp()"></app-hero>

<app-nav-categories></app-nav-categories>

<app-news-events></app-news-events>

<div id="app">
  <app-topbar></app-topbar>
  <div class="main-layout">
    <app-sidebar (selectPlace)="onSelectPlace($event)"></app-sidebar>
    <app-map-canvas (openModal)="onOpenModal($event)"></app-map-canvas>
  </div>
</div>

<app-place-modal
  [place]="selectedPlace()"
  (close)="onCloseModal()"
></app-place-modal>

<app-news-lists></app-news-lists>

<div class="lakes-layout" id="lakes-section">
  <div class="lakes-section-nav">
    <div class="lakes-section-nav-title">
      <span class="lakes-section-nav-dot"></span>
      Lake Fishing Guide
    </div>
    <span class="lakes-section-nav-meta">Älvdalen · {{ lakes.totalLakes }} Waters</span>
  </div>
  <div class="lakes-content">
    <app-lakes-sidebar (selectLake)="onSelectLake($event)"></app-lakes-sidebar>
    <app-lakes-map-canvas></app-lakes-map-canvas>
  </div>
</div>
